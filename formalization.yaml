# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "ry-lean: sets avoiding {x, x+y, x+y²} — Younis's two-set construction and the exponent 0.77028"
  description: >-
    A Lean 4 proof of Younis's lower-bound construction for subsets of {1,...,N} with no
    configuration {x, x+y, x+y^2} (y nonzero), in its two-set form: for every square-free
    modulus m and residue sets R1, R2 modulo m with R1 square-difference-free and no
    nonzero difference of R2 equal to the square of a difference of R1, the interval
    {1,...,N} contains a configuration-free set of size at least C(rho) N^rho for every
    rho below 1/2 + log|R1|/(3 log m) + log|R2|/(6 log m). The theorem is instantiated at
    m = 145 with |R1| = 10 and |R2| = 32, giving the exponent 0.770287..., which is proved
    to exceed Younis's exponent 0.768503... (m = 65, sizes 7 and 17) by exact comparisons
    of integer powers; decimal bounds 0.7702 < gamma < 0.77029 are also proved, and the
    bound is stated in liminf form for the counting function D(N).
  authors: ["JD Jones"]
  responsible_maintainers: ["JD Jones"]
  license: "MIT"

classification:
  arxiv: ["math.NT", "math.CO"]
  msc2020: ["11B30", "11B75", "05D10"]

sources:
