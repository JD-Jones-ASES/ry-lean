    author_endorsement: "not-contacted"
    note: >-
      The best published Furstenberg–Sárközy lower-bound exponent, 0.7527964558...; every
      square-difference-free set is configuration-free, so it transfers to this problem, and
      it is below both exponents compared here.

status:
  scope: >-
    Five compared declarations. younis_period_two is the two-set form of Younis's Theorem 1.5
    for every square-free modulus m >= 2 and every nonempty admissible pair (R1, R2), in the
    pointwise form "for every rho below the exponent there is C > 0 with a configuration-free
    subset of {1,...,N} of size at least C N^rho for all N >= 1". record_pointwise and
    record_liminf are its instance at m = 145 (|R1| = 10, |R2| = 32), the latter as a liminf
    bound for the counting function D. younis_lt_record and record_exponent_bounds are exact
    inequalities between real numbers defined by logarithms. Configurations use Younis's
    definition: y is any nonzero integer, negative values included, and the three integers
    need not be distinct. Nothing is claimed about upper bounds, optimality of the exponent,
    optimality of the residue sets, or other configurations. The intentional placeholders in
    Challenge.lean are excluded from proof counts; Solution does not import Challenge.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "NonlinearRoth.younis_period_two"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "NonlinearRoth.record_pointwise"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "NonlinearRoth.record_liminf"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "NonlinearRoth.younis_lt_record"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "NonlinearRoth.record_exponent_bounds"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

automation:
  methods:
    - method: "agent"
      models: ["Claude Fable 5.1 (Anthropic)", "Claude Opus (Anthropic)"]
      framework: "Claude Code with parallel subagents"
      tool_setup: >-
        Claude Fable 5.1 planned the formalization and wrote the statements and
        documentation; Claude Opus subagents reviewed the statements against the source,
        wrote the Lean proofs module by module, searched the literature and registries, and
        audited the result. Lean 4.33.0 and Mathlib are pinned. Finite checks use ordinary
        decide; the exponent comparisons are kernel-checked comparisons of integer powers.
        The residue sets at m = 145 were found by an exact computer search (a CP-SAT solver
        as a search tool); they are verified in Lean and by the standalone Python checker,
        so the solver is not in the trust chain.
      prompting_notes: >-
        The human operator selected the problem, required an unconditional theorem with
        explicit hypotheses matching the source, self-contained documentation, and an exact
        (non-numerical) proof of the exponent comparison.
  spend_usd: "not tracked"
  notes: "See DISCLOSURE.md. Prompt, token, and monetary accounting was not retained."

fidelity:
  divergences: >-
    The compared theorem is the k = 2, period-two, R_0 = Z/m specialisation of Younis's
    Theorem 1.5, stated for arbitrary square-free m >= 2 and arbitrary nonempty admissible
    (R_1, R_2); Younis's general chains (arbitrary k, arbitrary sequences R_n) are not
    formalized. The hypotheses are the two edge conditions R_0 -> R_1 and R_1 -> R_2 of
    the chain condition; the remaining edges of the periodic chain follow from the first and
    are derived, not assumed. The conclusion is stated with an arbitrary exponent rho below
    the displayed exponent and a constant depending on rho, which is Younis's
    |A| >>_{m, eps} N^{gamma - eps}. Sets live in Finset ℤ inside Finset.Icc 1 N. The
    construction is analysed through a periodic truncation of the digit rule (each depth
    gives a slightly smaller exponent, converging to the displayed one); this is a proof
    device and does not change the statements.

review:
  status: "self-assessed"
  notes: >-
    No independent human expert review or source-author endorsement is recorded. AI agents
    developed and cross-reviewed the proof; the statements were reviewed against the source
    text for dropped hypotheses and junk values. VERIFICATION.md records the mechanical
    checks completed at this snapshot. Mechanical correctness and statement agreement do not
    establish priority, significance, or the correctness of any informal interpretation.

alignment:
  namespace: "NonlinearRoth"
  statements:
    - source: "Younis, arXiv:1908.06058, Theorem 1.5 with k = 2, R_0 = Z/m, chain R_0, R_1, R_2, R_1, R_2, ..."
      lean: "NonlinearRoth.younis_period_two"
      module: "Solution"
      status: "proved"
      note: >-
        Hypotheses: m >= 2 square-free; R_1, R_2 nonempty finsets of ZMod m; R_1
        square-difference-free; no nonzero difference of R_2 is the square of a difference
        of R_1. Conclusion: for every rho below the exponent, a constant C > 0 and, for every
        N >= 1, a configuration-free finset A of integers with 1 <= x <= N for every x in A and
        cardinality at least C N^rho (membership in {1,...,N} is stated as the two bounds).
    - source: "Not in the source paper: Theorem 1.5 (k = 2) instantiated at new data m = 145, |R_1| = 10, |R_2| = 32 — the analogue of Younis's Theorem 1.1, which is the instance at m = 65"
      lean: "NonlinearRoth.record_pointwise"
      module: "Solution"
      status: "proved"
      note: "The exponent is recordExponent = 1/2 + log 10/(3 log 145) + log 32/(6 log 145)."
    - source: "liminf form of the same bound"
      lean: "NonlinearRoth.record_liminf"
      module: "Solution"
      status: "proved"
      note: "recordExponent <= liminf log D(N) / log N, where D N is the largest size of a configuration-free subset of {1,...,N}."
    - source: "comparison with Younis's exponent 1/2 + log 7/(3 log 65) + log 17/(6 log 65)"
      lean: "NonlinearRoth.younis_lt_record"
      module: "Solution"
      status: "proved"
      note: "Proved from 833^13 < 65^21 and 3200^13 > 145^21."
    - source: "decimal bounds"
      lean: "NonlinearRoth.record_exponent_bounds"
      module: "Solution"
      status: "proved"
      note: "0.7702 < recordExponent < 0.77029, from 3200^37 > 145^60 and 3200^230 < 145^373."

