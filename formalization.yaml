    authors: ["Khalid Younis"]
    id: "arXiv:1908.06058"
    type: "article"
    location: "https://arxiv.org/abs/1908.06058"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Theorem 1.5 (k = 2, R_0 = Z/m, the periodic chain R_0, R_1, R_2, R_1, R_2, ...) is
      the compared theorem younis_period_two; its exponent formula (1.2) evaluates to the
      displayed exponent. Theorem 1.1 is this theorem at m = 65 with |R_1| = 7, |R_2| = 17.
      The repository instantiates the same theorem at m = 145 with new residue sets and
      proves the new exponent larger. The paper is a 2019 preprint (v1 only, no journal
      version found as of 2026-09-11).
  - title: "Difference sets without squares"
    authors: ["Imre Z. Ruzsa"]
    id: "doi:10.1007/BF02454169"
    type: "article"
    location: "https://doi.org/10.1007/BF02454169"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: "Periodica Mathematica Hungarica 15 (1984), 205-209. The base-m digit construction that Younis's theorem extends; Younis's modulus 65 is Ruzsa's."
  - title: "An improved lower bound related to the Furstenberg–Sárközy theorem"
    authors: ["Mark Lewko"]
    type: "article"
    location: "https://www.combinatorics.org/ojs/index.php/eljc/article/view/v22i1p32"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: "Electronic Journal of Combinatorics 22 (2015), #P1.32. Exhaustive census of square-difference-free residue sets below modulus 533; the search pattern used to find the residue sets here."
  - title: "Square-difference-free sets of size Ω(n^0.7334...)"
    authors: ["Richard Beigel", "William Gasarch"]
    id: "arXiv:0804.4892"
    type: "article"
    location: "https://arxiv.org/abs/0804.4892"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: "Independent record at modulus 205 for the Furstenberg–Sárközy problem; same search pattern."
  - title: "A polylogarithmic bound in the nonlinear Roth theorem"
    authors: ["Sarah Peluse", "Sean Prendiville"]
    id: "doi:10.1093/imrn/rnaa261"
    type: "article"
    location: "https://doi.org/10.1093/imrn/rnaa261"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: "IMRN 2022, no. 8, 5658-5684. The upper bound N (log N)^(-c) for configuration-free subsets of {1,...,N}; the other side of the problem, not formalized here."
  - title: "Polynomial extensions of van der Waerden's and Szemerédi's theorems"
    authors: ["Vitaly Bergelson", "Alexander Leibman"]
    id: "doi:10.1090/S0894-0347-96-00194-4"
    type: "article"
    location: "https://doi.org/10.1090/S0894-0347-96-00194-4"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: "J. Amer. Math. Soc. 9 (1996), 725-753. The qualitative polynomial Szemerédi theorem, of which the configuration {x, x+y, x+y^2} is the model case."
  - title: "Square-Difference-Free Sets beyond the Three-Quarter Barrier"
    authors: ["Dmitry Krachun"]
    id: "arXiv:2608.01325"
    type: "article"
    location: "https://arxiv.org/abs/2608.01325"
